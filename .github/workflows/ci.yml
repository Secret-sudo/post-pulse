name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: TC-B01 typecheck
        run: npm run typecheck
      - name: TC-B01 lint
        run: npm run lint
      - name: TC-B01 format
        run: npm run format:check
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: TC-B01 build
        run: npm run build
      - name: TC-N03 bundle size
        run: npm run size
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E tests
        run: npm run test:e2e
      - name: TC-N04 Lighthouse
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            playwright-report
            .lighthouseci
          retention-days: 7
